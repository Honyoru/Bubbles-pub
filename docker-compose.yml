services:
  postgres:
    image: postgres:16-alpine
    container_name: db-bubbles
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: db-bubbles
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/db-bubbles.sql:/docker-entrypoint-initdb.d/db-bubbles.sql:ro

volumes:
  postgres_data: